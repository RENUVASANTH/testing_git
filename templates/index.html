
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f6f8;
        }
        h1 { color: #243b53; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th { background: #243b53; color: white; }
    </style>
</head>
<body>
    <h1>Student Management System</h1>
    <p><a href="{{ url_for('register') }}">+ Register New Student</a></p>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Student Name</th>
                <th>Course</th>
                <th>Fee</th>
                <th>Manage</th>                
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student[0] }}</td>
                <td>{{ student[1] }}</td>
                <td>{{ student[2] }}</td>
                <td>{{ "%.2f"|format(student[3]) }}</td>
            <td>
                    <a class="edit-btn"
                       href="{{ url_for('edit_student', student_id=student[0]) }}">
                        Edit
                    </a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5">No students found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
